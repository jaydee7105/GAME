name: Android build

# Builds the web game, wraps it with Capacitor and produces:
#   app-release.aab  -> upload to Google Play
#   app-release.apk  -> install on your own phone for testing
#
# Signing: add repository secrets (Settings > Secrets and variables > Actions)
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_ALIAS    key alias
#   ANDROID_KEYSTORE_PASSWORD keystore / key password
# Without them a throwaway key is used: fine for testing, NOT for uploading.
#
# Ads: add these secrets from your AdMob account (see docs/PUBLISHING.md)
#   ADMOB_APP_ID              ca-app-pub-XXXX~YYYY
#   ADMOB_BANNER_ID           ca-app-pub-XXXX/1111
#   ADMOB_INTERSTITIAL_ID     ca-app-pub-XXXX/2222
#   ADMOB_REWARDED_ID         ca-app-pub-XXXX/3333
# Without them Google's test ads are shown (safe, but they earn nothing).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "store/**", "docs/**", "art/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Every puzzle's stored solution still wins
        run: npx tsx tools/verify-puzzles.ts
      - name: Smoke test in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:4173 > /dev/null && break; sleep 1; done
          npm test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build web app and sync into Android
        env:
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
        run: |
          if [ -z "$VITE_ADMOB_BANNER_ID" ]; then
            echo "::warning::No AdMob secrets set - this build shows Google test ads and earns nothing."
          fi
          npm ci
          npm run build
          npx cap sync android

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - using a throwaway key. Do not upload this build to Google Play."
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -alias planetdrop -storepass throwaway -keypass throwaway \
              -dname "CN=Planet Drop Test" -keyalg RSA -keysize 2048 -validity 9999 -noprompt
            echo "ANDROID_KEY_ALIAS=planetdrop" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=throwaway" >> "$GITHUB_ENV"
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build App Bundle and APK
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          # Every CI run gets a higher version code, as Google Play requires.
          code=$(( ${{ github.run_number }} + 100 ))
          echo "Version code: $code"
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease -PversionCode=$code

      - uses: actions/upload-artifact@v4
        with:
          name: planet-drop-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
