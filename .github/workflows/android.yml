name: Android build

# Builds the Play Store bundle (.aab) and an installable test .apk.
#
# Signing: add these repository secrets (Settings > Secrets and variables > Actions)
#   ANDROID_KEYSTORE_BASE64  base64 of your upload keystore (.jks)
#   ANDROID_KEYSTORE_ALIAS   key alias inside the keystore
#   ANDROID_KEYSTORE_PASSWORD keystore / key password
# Without them a throwaway key is generated: fine for testing, NOT for uploading.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["**.md", "store/**", "docs/**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); add what Godot 4.7 targets.
        run: |
          sdkm=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkm" --licenses > /dev/null || true
          "$sdkm" "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && rm godot.zip
          unzip -q templates.tpz && rm templates.tpz
          # Only keep what an Android export needs; the cache stays small.
          find templates -type f ! -name 'android_*' ! -name 'version.txt' -delete

      - name: Install Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          sudo ln -sf ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Configure Godot editor for Android
        run: |
          keytool -genkeypair -keystore ~/debug.keystore -alias androiddebugkey -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 9999 -noprompt
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/upload.jks
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets set - using a throwaway key. Do not upload this build to Google Play."
            keytool -genkeypair -keystore ~/upload.jks -alias planetdrop -storepass throwaway -keypass throwaway \
              -dname "CN=Planet Drop Test" -keyalg RSA -keysize 2048 -validity 9999 -noprompt
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=planetdrop" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=throwaway" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/upload.jks" >> "$GITHUB_ENV"

      - name: Set version code
        run: |
          # Each CI run gets a higher version code, as Google Play requires.
          code=$(( ${{ github.run_number }} + 100 ))
          sed -i "s/^version\/code=.*/version\/code=${code}/" export_presets.cfg
          echo "Version code: ${code}"

      - name: Import project
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import

      - name: Export App Bundle (.aab)
        run: |
          mkdir -p build/android
          # Also installs the Gradle build template into android/ on first use.
          godot --headless --path . --install-android-build-template --export-release "Android" build/android/planet-drop.aab
          test -s build/android/planet-drop.aab

      - name: Export test APK
        run: |
          godot --headless --path . --export-release "Android APK" build/android/planet-drop.apk
          test -s build/android/planet-drop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: planet-drop-android
          path: |
            build/android/planet-drop.aab
            build/android/planet-drop.apk
          if-no-files-found: error
