name: Web build

# Builds a browser-playable version. To publish it at
# https://<user>.github.io/<repo>/ turn on Settings > Pages > Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "store/**", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-web
          key: godot-web-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-web && cd ~/godot-web
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && rm godot.zip
          unzip -q templates.tpz && rm templates.tpz
          find templates -type f ! -name 'web_*' ! -name 'version.txt' -delete

      - name: Export
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          ln -sfn ~/godot-web/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot=~/godot-web/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $godot --headless --path . --import || true
          $godot --headless --path . --import
          mkdir -p build/web
          $godot --headless --path . --export-release "Web" build/web/index.html
          test -s build/web/index.pck

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Skipped quietly until GitHub Pages is switched on for the repository.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
