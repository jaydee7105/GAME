name: Web build

# Publishes a browser-playable version. Turn it on with
# Settings > Pages > Source: "GitHub Actions"; it then deploys from main.

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "store/**", "docs/**", "art/**", "roblox/**", ".github/workflows/roblox.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Skipped quietly until GitHub Pages is switched on for the repository.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
